name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv venv -p 3.13
          uv pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest --tb=short -v

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Not yet done, tracked separately: brand assets (needs actual
          # icon/logo design + a PR to home-assistant/brands) and a LICENSE
          # file (explicitly deferred for now).
          ignore: brands,license
