[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-nevermind"
version = "0.1.0"
description = "Home Assistant custom integration for Nevermind"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.1.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "aioresponses>=0.7.6",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/nevermind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short -v"
