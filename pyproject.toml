[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-nevermind"
version = "0.1.0"
description = "Home Assistant custom integration for Nevermind"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    # homeassistant pins an *exact* aiohttp version internally, and
    # aioresponses monkeypatches aiohttp internals that occasionally change
    # between releases (e.g. ClientResponse's constructor signature) — pin
    # to a version combination confirmed to work together rather than an
    # open floor, so a routine homeassistant point release can't silently
    # break aioresponses in CI.
    "homeassistant==2026.2.3",
    "pytest-homeassistant-custom-component==0.13.316",
    "aioresponses==0.7.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/nevermind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short -v"
